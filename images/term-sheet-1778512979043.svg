<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="700" height="580">
  <defs>
    <clipPath id="bd-clip">
      <rect x="0" y="0" width="700" height="580" rx="12" ry="12" />
    </clipPath>
  </defs>
  
  <foreignObject width="100%" height="100%" style="clip-path: url(#bd-clip);">
    <style>
      @import url("https://fonts.googleapis.com/css?family=Inconsolata");
      ._wrapper { 
        width: 100%; 
        height: 100%; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        /* 使用纯透明背景，彻底去掉白色 */
        background: transparent; 
      }
      ._container { 
        padding: 10px; 
        width: 95%;
        height: 90%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      ._terminal { 
        display: flex; 
        flex-direction: column; 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        border-radius: 10px; 
        background: #282c34; /* One Dark 灰色背景 */
        /* 在透明背景下，使用更深邃、扩散更广的黑色阴影 */
        box-shadow: 0 30px 70px rgba(0,0,0,0.8);
      }
      ._title-bar { 
        height: 28px; 
        background: #21252b; /* 略深色标题栏 */
        display: flex; 
        align-items: center; 
        justify-content: center; 
        position: relative;
        border-bottom: 1px solid #181a1f;
      }
      ._dots { 
        position: absolute; 
        left: 14px; 
        display: flex; 
        gap: 8px;
      }
      ._dot { width: 12px; height: 12px; border-radius: 50%; }
      ._red { background: #ff5f57; }
      ._yellow { background: #ffbd2e; }
      ._green { background: #28c940; }
      ._title { 
        color: #abb2bf; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        font-size: 12px; 
      }
      ._content { 
        flex: 1; 
        padding: 20px; 
        font-family: 'Inconsolata', monospace; 
        font-size: 14px; 
        line-height: 1.6; 
        color: #abb2bf;
        overflow: hidden; /* 防止 GitHub README 内部滚动 */
      }
      .blue { color: #61afef; }
      .yellow { color: #e5c07b; }
      .green { color: #98c379; }
      .purple { color: #c678dd; }
      .gray { color: #7f848e; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      ._line { animation: fadeIn 0.5s ease forwards; }
    </style>
    <div xmlns="http://www.w3.org/1999/xhtml" class="_wrapper">
      <div class="_container">
        <div class="_terminal">
          <div class="_title-bar">
            <div class="_dots">
              <div class="_dot _red"></div>
              <div class="_dot _yellow"></div>
              <div class="_dot _green"></div>
            </div>
            <div class="_title">shiny — zsh — 80×24</div>
          </div>
          <div class="_content">
            <div class="_line"><span class="blue">~&gt;</span> init --profile shiny skills</div>
            <div class="_line" style="margin-top: 10px;"><b class="yellow">Index :: Skills Mapping</b></div>
            <div class="_line"><span class="blue">Linux        </span> :: Shell Script, Systemd, Nginx, Others</div>
            <div class="_line"><span class="blue">Containers   </span> :: Dockerfile, Docker Compose</div>
            <div class="_line"><span class="blue">Kubernetes   </span> :: Yaml, Ingress, Crds, Operator</div>
            <div class="_line"><span class="blue">CI/CD        </span> :: Jenkins Shared Library, Ansible</div>
            <div class="_line"><span class="blue">Observability</span> :: Prometheus, Grafana, ELK Stack</div>
            <div class="_line"><span class="blue">Languages    </span> :: Go, Python</div>
            <div class="_line"><span class="blue">Reverse      </span> :: Binary Analysis &amp; x86_64 Assembly</div>
            <div class="_line" style="margin-top: 10px;"><span class="gray">/* Vibe Coding to Create, Reverse Engineering to understand. */</span></div>
            <div class="_line" style="margin-top: 20px;"><span class="blue">~&gt;</span> cat contacts.yml</div>
            <div class="_line" style="margin-top: 5px;">Fetching contact info...</div>
            <div class="_line">--------------------------</div>
            <div class="_line">Email:  <span class="green">kuops@gmail.com</span></div>
            <div class="_line">Blog:   <span class="green">https://kuops.github.io</span></div>
            <div class="_line">Status: <span class="purple">Steady progressing towards Ring 0...</span></div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
